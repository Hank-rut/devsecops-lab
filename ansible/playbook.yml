- hosts: app
  become: true
  tasks:
    - name: Обновить систему
      apt: { update_cache: yes, upgrade: dist }

    - name: Установить пакеты
      apt:
        name: [fail2ban, ufw, unattended-upgrades, docker.io, docker-compose-v2, auditd]
        state: present

    - name: Добавить ubuntu в группу docker
      user: { name: ubuntu, groups: docker, append: yes }

    - name: SSH — запретить root и пароли
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.re }}"
        line: "{{ item.line }}"
        validate: "sshd -t -f %s"
      loop:
        - { re: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { re: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { re: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
      notify: restart sshd

    - name: UFW — политика по умолчанию
      ufw: { state: enabled, policy: deny, direction: incoming }

    - name: UFW — разрешить порты
      ufw: { rule: allow, port: "{{ item }}", proto: tcp }
      loop: ["22", "80", "3000"]

    - name: fail2ban включён
      service: { name: fail2ban, state: started, enabled: yes }

    - name: Автообновления безопасности
      service: { name: unattended-upgrades, state: started, enabled: yes }

    - name: auditd включён
      service: { name: auditd, state: started, enabled: yes }

  handlers:
    - name: restart sshd
      service: { name: ssh, state: restarted }
